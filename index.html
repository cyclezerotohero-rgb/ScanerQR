<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYCLE POINT - Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Kanit', sans-serif; background-color: #285B48; min-height: 100vh; text-align: center; }
        .header { background-color: white; padding: 30px; border-radius: 0 0 40px 40px; }
        .form-section { padding: 30px 25px; max-width: 450px; margin: auto; display: none; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { color: white; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; border-radius: 10px; border: none; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border-radius: 50px; background-color: #FFD700; color: #285B48; border: none; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <img src="cyclepoint.png" style="width:150px;">
        <div id="loading-text">กำลังตรวจสอบข้อมูลสมาชิก...</div>
    </div>
    <div class="form-section" id="register-form">
        <div class="form-group"><label>ชื่อ-นามสกุล</label><input type="text" id="fullname"></div>
        <div class="form-group">
            <label>School/Organization</label>
            <select id="school">
                <option value="Sarasas School">Sarasas School</option>
                <option value="others">others</option>
            </select>
        </div>
        <button class="btn" onclick="saveData()">ลงทะเบียน</button>
    </div>
<script>
    const LIFF_ID = "2009955496-jzd8tA0e"; 
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwSzdRwt7NSULwyf4LWeh9lHlz5vy8-FPM29MdWfO2CIoueA0usinNYoCQdqQY7A24G/exec";

    async function init() {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) { liff.login(); }
        else {
            const profile = await liff.getProfile();
            const res = await fetch(`${WEB_APP_URL}?action=checkUser&lineId=${profile.userId}`);
            const data = await res.json();
            if (data.exists) { window.location.href = "scanandpoint.html"; }
            else {
                document.getElementById('loading-text').style.display = 'none';
                document.getElementById('register-form').style.display = 'block';
                localStorage.setItem('uid', profile.userId);
            }
        }
    }
    async function saveData() {
        const payload = {
            action: "register",
            lineId: localStorage.getItem('uid'),
            fullname: document.getElementById('fullname').value,
            dept: document.getElementById('school').value
        };
        await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
        alert("ลงทะเบียนสำเร็จ!");
        window.location.href = "scanandpoint.html";
    }
    window.onload = init;
</script>
</body>
</html>
