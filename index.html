<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CYCLE POINT</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Kanit', sans-serif; background-color: #285B48; text-align: center; }
        .header-white { background: white; padding: 40px 20px; border-radius: 0 0 40px 40px; }
        .logo { width: 180px; margin-bottom: 20px; }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; border: 4px solid #FFD700; display: none; margin: 10px auto; object-fit: cover; }
        .user-name { color: #285B48; font-weight: bold; font-size: 1.2rem; margin-top: 10px; }
        .form-area { padding: 30px; max-width: 400px; margin: auto; display: none; }
        input, select { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 12px; border: none; font-family: 'Kanit'; box-sizing: border-box; }
        label { display: block; color: white; text-align: left; margin-bottom: 5px; }
        .btn-yellow { width: 100%; padding: 18px; background: #FFD700; color: #285B48; border: none; border-radius: 50px; font-weight: bold; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>

<div class="header-white">
    <!-- ใส่โลโก้บนสุด -->
    <img src="cyclepoint.png" class="logo"> 
    <div id="loading">กำลังเชื่อมต่อ LINE...</div>
    <img src="" id="user-pic" class="profile-img">
    <div id="user-display" class="user-name"></div>
</div>

<div class="form-area" id="main-form">
    <label>กรอกชื่อ-นามสกุลจริง ของท่าน</label>
    <input type="text" id="fullname" placeholder="ชื่อ-นามสกุล">
    
    <label>เบอร์โทรศัพท์</label>
    <input type="tel" id="phone" placeholder="08XXXXXXXX">

    <label>โรงเรียน/หน่วยงาน</label>
    <select id="school">
        <option value="โรงเรียนสารสาสน์วิเทศเชียงใหม่">โรงเรียนสารสาสน์วิเทศเชียงใหม่</option>
    </select>

    <label>จังหวัด</label>
    <select id="province">
        <option value="">เลือกจังหวัด</option>
    </select>

    <button class="btn-yellow" onclick="saveData()">ยืนยันข้อมูล</button>
</div>

<script>
    // รายชื่อจังหวัดเรียง ก-ฮ
    const provinces = ["กระบี่", "กรุงเทพมหานคร", "กาญจนบุรี", "กาฬสินธุ์", "กำแพงเพชร", "ขอนแก่น", "จันทบุรี", "ฉะเชิงเทรา", "ชลบุรี", "ชัยนาท", "ชัยภูมิ", "ชุมพร", "เชียงราย", "เชียงใหม่", "ตรัง", "ตราด", "ตาก", "นครนายก", "นครปฐม", "นครพนม", "นครราชสีมา", "นครศรีธรรมราช", "นครสวรรค์", "นนทบุรี", "นราธิวาส", "น่าน", "บึงกาฬ", "บุรีรัมย์", "ปทุมธานี", "ประจวบคีรีขันธ์", "ปราจีนบุรี", "ปัตตานี", "พระนครศรีอยุธยา", "พะเยา", "พังงา", "พัทลุง", "พิจิตร", "พิษณุโลก", "เพชรบุรี", "เพชรบูรณ์", "แพร่", "ภูเก็ต", "มหาสารคาม", "มุกดาหาร", "แม่ฮ่องสอน", "ยโสธร", "ยะลา", "ร้อยเอ็ด", "ระนอง", "ระยอง", "ราชบุรี", "ลพบุรี", "ลำปาง", "ลำพูน", "เลย", "ศรีสะเกษ", "สกลนคร", "สงขลา", "สตูล", "สมุทรปราการ", "สมุทรสงคราม", "สมุทรสาคร", "สระแก้ว", "สระบุรี", "สิงห์บุรี", "สุโขทัย", "สุพรรณบุรี", "สุราษฎร์ธานี", "สุรินทร์", "หนองคาย", "หนองบัวลำภู", "อ่างทอง", "อำนาจเจริญ", "อุดรธานี", "อุตรดิตถ์", "อุทัยธานี", "อุบลราชธานี"];
    const pSelect = document.getElementById('province');
    provinces.forEach(p => { pSelect.options.add(new Option(p, p)); });

    async function initLIFF() {
        try {
            // ก๊อปปี้ LIFF ID จากหน้า LINE Developers มาใส่ตรงนี้ครับ
            await liff.init({ liffId: "https://liff.line.me/2009955496-jzd8tA0e" }); 
            if (!liff.isLoggedIn()) {
                liff.login();
            } else {
                const profile = await liff.getProfile();
                // แสดงข้อมูลโปรไฟล์
                document.getElementById('user-pic').src = profile.pictureUrl;
                document.getElementById('user-pic').style.display = 'block';
                document.getElementById('user-display').innerText = profile.displayName;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('main-form').style.display = 'block';
                
                localStorage.setItem('line_uid', profile.userId);
            }
        } catch (err) {
            console.error(err);
        }
    }

    function saveData() {
        // โค้ดส่งข้อมูลไปยัง Google Sheets ที่เราเคยทำไว้
        alert("ลงทะเบียนสำเร็จ!");
        window.location.href = "home.html";
    }

    window.onload = initLIFF;
</script>
</body>
</html>
