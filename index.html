<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียน - CYCLE POINT</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Kanit', sans-serif; background-color: #285B48; min-height: 100vh; text-align: center; }
        .header-section { background-color: white; padding: 40px 20px; border-radius: 0 0 40px 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .logo-main { width: 180px; margin-bottom: 20px; }
        .profile-img { width: 110px; height: 110px; border-radius: 50%; border: 4px solid #FFD700; object-fit: cover; display: none; margin: 10px auto; }
        .user-name { color: #285B48; font-weight: bold; font-size: 1.2rem; margin-top: 10px; display: none; }
        #loading-text { color: #285B48; font-weight: bold; margin-top: 20px; }
        .form-section { padding: 30px 25px; max-width: 450px; margin: auto; display: none; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; color: white; margin-bottom: 8px; font-size: 1rem; }
        input, select { width: 100%; padding: 15px; border-radius: 12px; border: none; background: white; font-family: 'Kanit'; box-sizing: border-box; font-size: 1rem; }
        .btn-submit { width: 100%; padding: 18px; border-radius: 50px; background-color: #FFD700; color: #285B48; border: none; font-size: 1.3rem; font-weight: 700; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

<div class="header-section">
    <img src="cyclepoint.png" alt="LOGO" class="logo-main">
    <div id="loading-text">กำลังตรวจสอบข้อมูลสมาชิก...</div>
    <img src="" id="user-pic" class="profile-img">
    <div id="user-display" class="user-name"></div>
</div>

<div class="form-section" id="register-form">
    <div class="form-group">
        <label>ชื่อ-นามสกุล</label>
        <input type="text" id="fullname" placeholder="ชื่อ-นามสกุล">
    </div>
    <div class="form-group">
        <label>เบอร์โทรศัพท์</label>
        <input type="tel" id="phone" placeholder="08XXXXXXXX">
    </div>
    <div class="form-group">
        <label>โรงเรียน/หน่วยงาน</label>
        <select id="school">
            <option value="โรงเรียนสารสาสน์วิเทศเชียงใหม่">โรงเรียนสารสาสน์วิเทศเชียงใหม่</option>
            <option value="อื่นๆ">อื่นๆ</option>
        </select>
    </div>
    <div class="form-group">
        <label>จังหวัด</label>
        <select id="province">
            <option value="">เลือกจังหวัด</option>
        </select>
    </div>
    <button class="btn-submit" onclick="saveData()">ยืนยันข้อมูลสมาชิก</button>
</div>

<script>
    const LIFF_ID = "2009955496-jzd8tA0e"; 
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzg2I2bdEOQhY6OJSAnTOzzjieoUZC8j24s8rioXefhkN29yrynx-OKaEt68y88_5j1/exec";

    // รายชื่อจังหวัด
    const PROVINCES = ["กรุงเทพมหานคร", "เชียงใหม่", "ชลบุรี", "นครราชสีมา", "ขอนแก่น"]; // เพิ่มให้ครบ 77 จังหวัดตามโค้ดเดิม
    const pSelect = document.getElementById('province');
    PROVINCES.forEach(p => { pSelect.options.add(new Option(p, p)); });

    async function initLIFF() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) {
                liff.login();
            } else {
                const profile = await liff.getProfile();
                const lineId = profile.userId;

                // ตรวจสอบสถานะการลงทะเบียน
                const res = await fetch(`${WEB_APP_URL}?action=checkUser&lineId=${lineId}`);
                const data = await res.json();

                if (data.exists) {
                    window.location.href = "scanandpoint.html"; // ถ้ามีข้อมูลแล้วไปหน้าสะสมแต้ม
                } else {
                    document.getElementById('user-pic').src = profile.pictureUrl;
                    document.getElementById('user-pic').style.display = 'block';
                    document.getElementById('user-display').innerText = profile.displayName;
                    document.getElementById('loading-text').style.display = 'none';
                    document.getElementById('register-form').style.display = 'block';
                    localStorage.setItem('line_uid', lineId);
                }
            }
        } catch (err) { console.error(err); }
    }

    async function saveData() {
        const lineId = localStorage.getItem('line_uid');
        const payload = {
            action: "register",
            lineId: lineId,
            fullname: document.getElementById('fullname').value,
            phone: document.getElementById('phone').value,
            school: document.getElementById('school').value,
            province: document.getElementById('province').value
        };

        if (!payload.fullname || !payload.phone) { alert("กรุณากรอกข้อมูลให้ครบ"); return; }

        await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
        alert("ลงทะเบียนสำเร็จ!");
        window.location.href = "scanandpoint.html";
    }

    window.onload = initLIFF;
</script>
</body>
</html>
