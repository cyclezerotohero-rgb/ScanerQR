<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan & Point - CYCLE POINT</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { margin: 0; font-family: 'Kanit', sans-serif; background-color: #285B48; text-align: center; }
        .header-white { background-color: white; padding: 25px; border-radius: 0 0 35px 35px; margin-bottom: 20px; }
        .point-box { background-color: #001f3f; color: white; display: inline-flex; align-items: center; padding: 10px 25px; border-radius: 50px; font-size: 1.2rem; }
        .point-val { color: #FFD700; font-weight: bold; font-size: 1.5rem; margin: 0 10px; }
        .scan-card { background-color: #FFD700; padding: 20px; border-radius: 25px; width: 90%; max-width: 500px; margin: 0 auto; box-sizing: border-box; }
        .input-group { position: relative; margin-bottom: 12px; }
        input { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid #285B48; box-sizing: border-box; font-size: 1rem; }
        .cam-btn { position: absolute; right: 8px; top: 6px; background: #285B48; color: white; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
        #reader { width: 100%; border-radius: 15px; overflow: hidden; display: none; margin-bottom: 15px; border: 3px solid #285B48; }
        .btn-confirm { width: 100%; padding: 15px; border-radius: 50px; background-color: #285B48; color: white; border: none; font-size: 1.2rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="header-white">
        <div class="point-box">Cycle point ของคุณ<span id="pts" class="point-val">0</span> P</div>
    </div>
    <div class="scan-card">
        <div id="reader"></div>
        <p style="color:#285B48; font-weight:bold; margin-top:0;">กดไอคอนกล้องเพื่ออ่าน Barcode</p>
        <div class="input-group"><input type="text" id="c1" placeholder="รหัสที่ 1"><span class="cam-btn" onclick="startScan(1)">📷</span></div>
        <div class="input-group"><input type="text" id="c2" placeholder="รหัสที่ 2"><span class="cam-btn" onclick="startScan(2)">📷</span></div>
        <div class="input-group"><input type="text" id="c3" placeholder="รหัสที่ 3"><span class="cam-btn" onclick="startScan(3)">📷</span></div>
        <div class="input-group"><input type="text" id="c4" placeholder="รหัสที่ 4"><span class="cam-btn" onclick="startScan(4)">📷</span></div>
        <div class="input-group"><input type="text" id="c5" placeholder="รหัสที่ 5"><span class="cam-btn" onclick="startScan(5)">📷</span></div>
        <button class="btn-confirm" onclick="submit()">ยืนยันรับแต้ม</button>
    </div>
<script>
    const LIFF_ID = "2009955496-jzd8tA0e";
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx_SkGj1VTNds8f6YbCHb-3-FuX3YDxlieVcV6TQzHREifsh1mpgJOmfP98p0kX8ZQh/exec";
    let html5QrCode;

    async function init() {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) { liff.login(); return; }
        const profile = await liff.getProfile();
        const res = await fetch(`${WEB_APP_URL}?action=checkUser&lineId=${profile.userId}`);
        const data = await res.json();
        document.getElementById('pts').innerText = data.points;
    }

    function startScan(id) {
        if (liff.isInClient() && liff.getOS() !== "web") {
            liff.scanCodeV2().then(r => { document.getElementById('c' + id).value = r.value; });
        } else {
            const rDiv = document.getElementById('reader');
            rDiv.style.display = 'block';
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, 
                t => { document.getElementById('c' + id).value = t; html5QrCode.stop(); rDiv.style.display = 'none'; });
        }
    }

    async function submit() {
        const profile = await liff.getProfile();
        const codes = [1,2,3,4,5].map(i => document.getElementById('c'+i).value).filter(v => v);
        if (codes.length === 0) return alert("กรุณาสแกนรหัสก่อนครับ");
        document.querySelector('.btn-confirm').innerText = "กำลังบันทึก...";
        await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "addPoints", lineId: profile.userId, codes: codes }) });
        alert("สะสมแต้มสำเร็จ!"); location.reload();
    }
    window.onload = init;
</script>
</body>
</html>
