<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan & Point</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script> <!-- ตัวช่วยสแกนบนเว็บ -->
    <style>
        body { margin: 0; font-family: 'Kanit', sans-serif; background-color: #285B48; text-align: center; }
        .header-white { background-color: white; padding: 25px; border-radius: 0 0 35px 35px; }
        .point-box { background-color: #001f3f; color: white; padding: 10px 25px; border-radius: 50px; display: inline-block; }
        .scan-card { background-color: #FFD700; padding: 20px; border-radius: 25px; width: 85%; margin: 20px auto; }
        .input-group { position: relative; margin-bottom: 10px; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #285B48; box-sizing: border-box; }
        .cam-btn { position: absolute; right: 5px; top: 5px; background: #285B48; color: white; padding: 7px; border-radius: 8px; cursor: pointer; }
        #reader { width: 100%; margin-top: 10px; border-radius: 15px; overflow: hidden; display: none; }
    </style>
</head>
<body>
    <div class="header-white"><div class="point-box">คะแนนของคุณ <span id="pts" style="color:#FFD700">0</span> P</div></div>
    <div class="scan-card">
        <div id="reader"></div>
        <div class="input-group"><input type="text" id="c1" placeholder="รหัสที่ 1"><span class="cam-btn" onclick="startScan(1)">📷</span></div>
        <button onclick="submit()" style="margin-top:15px; padding:15px; width:100%; border-radius:50px; background:#285B48; color:white; border:none; font-weight:bold;">ยืนยันรับแต้ม</button>
    </div>
<script>
    const LIFF_ID = "2009955496-jzd8tA0e";
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxPMEdtm2BhEMbgeiM7IIbh5U3CygaoHj_lGM2Xu49EgaJuM1IGvT5ZkrGp7wBjdYH8/exec";
    let html5QrCode;

    async function init() {
        await liff.init({ liffId: LIFF_ID });
        const profile = await liff.getProfile();
        const res = await fetch(`${WEB_APP_URL}?action=checkUser&lineId=${profile.userId}`);
        const data = await res.json();
        document.getElementById('pts').innerText = data.points;
    }

    function startScan(id) {
        if (liff.isInClient() && liff.getOS() !== "web") {
            liff.scanCodeV2().then(r => { document.getElementById('c' + id).value = r.value; });
        } else {
            document.getElementById('reader').style.display = 'block';
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, 
                txt => { document.getElementById('c' + id).value = txt; html5QrCode.stop(); document.getElementById('reader').style.display = 'none'; });
        }
    }

    async function submit() {
        const profile = await liff.getProfile();
        const codes = [document.getElementById('c1').value].filter(v => v);
        await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "addPoints", lineId: profile.userId, codes: codes }) });
        alert("สะสมแต้มสำเร็จ!"); location.reload();
    }
    window.onload = init;
</script>
</body>
</html>
