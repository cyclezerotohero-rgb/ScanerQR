<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan & Point - CYCLE POINT</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Kanit', sans-serif; background-color: #285B48; min-height: 100vh; }
        
        /* ส่วนบนสีขาว */
        .header-white { background-color: white; padding: 30px 20px; border-radius: 0 0 35px 35px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .point-box { background-color: #001f3f; color: white; display: inline-flex; align-items: center; padding: 8px 25px; border-radius: 50px; font-size: 1.2rem; margin-bottom: 10px; }
        .point-box img { height: 24px; margin-left: 10px; }
        .point-val { font-weight: bold; font-size: 1.5rem; margin: 0 10px; color: #FFD700; }
        .expiry-text { color: #666; font-size: 0.8rem; }

        /* ส่วนล่างสีเขียว */
        .content-section { padding: 25px; text-align: center; }
        .scan-container { background-color: #FFD700; padding: 25px 15px; border-radius: 25px; max-width: 400px; margin: auto; box-shadow: 0 6px 12px rgba(0,0,0,0.2); }
        .title-text { color: #285B48; font-weight: bold; margin-bottom: 20px; font-size: 1.1rem; }

        /* ช่องกรอกข้อมูล */
        .input-wrapper { position: relative; margin-bottom: 12px; }
        .code-input { width: 100%; padding: 12px 50px 12px 15px; border-radius: 15px; border: 2px solid #285B48; background-color: white; font-family: 'Kanit'; box-sizing: border-box; font-size: 1rem; color: #285B48; }
        .cam-icon { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background-color: #285B48; color: white; width: 35px; height: 35px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        .btn-confirm { width: 100%; padding: 15px; border-radius: 50px; background-color: #285B48; color: white; border: none; font-size: 1.2rem; font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        .btn-confirm:active { transform: scale(0.98); background-color: #1a3d31; }
    </style>
</head>
<body>

<div class="header-white">
    <div class="point-box">
        CyclePoint ของคุณ <span id="user-points" class="point-val">0</span>
        <img src="pointlogo.png" alt="P">
    </div>
    <div class="expiry-text">คุณมี <span id="point-detail">0</span> P • หมดอายุ 31 ธ.ค. 2569</div>
</div>

<div class="content-section">
    <div class="scan-container">
        <div class="title-text">กดที่iconกล้อง<br>เพื่อสแกนรับแต้มสะสม Cycle Point</div>
        
        <!-- ช่องกรอก 5 ช่อง -->
        <div class="input-wrapper"><input type="text" class="code-input" placeholder="รหัสที่ 1" id="code1"><div class="cam-icon" onclick="scanQR(1)">📷</div></div>
        <div class="input-wrapper"><input type="text" class="code-input" placeholder="รหัสที่ 2" id="code2"><div class="cam-icon" onclick="scanQR(2)">📷</div></div>
        <div class="input-wrapper"><input type="text" class="code-input" placeholder="รหัสที่ 3" id="code3"><div class="cam-icon" onclick="scanQR(3)">📷</div></div>
        <div class="input-wrapper"><input type="text" class="code-input" placeholder="รหัสที่ 4" id="code4"><div class="cam-icon" onclick="scanQR(4)">📷</div></div>
        <div class="input-wrapper"><input type="text" class="code-input" placeholder="รหัสที่ 5" id="code5"><div class="cam-icon" onclick="scanQR(5)">📷</div></div>

        <button class="btn-confirm" onclick="submitPoints()">ยืนยัน</button>
    </div>
</div>

<script>
    const LIFF_ID = "2009955496-jzd8tA0e"; // ใช้ ID จากภาพ image_05a4ab.png
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxgkcz7HjvAvfnoaVVV0k-BsUwCkUh3hDKb2b3Y-wjtn7Q56D8re9L38TQX3ayuqv5L/exec";

    async function initPage() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (liff.isLoggedIn()) {
                fetchUserData();
            } else {
                liff.login();
            }
        } catch (err) { console.error(err); }
    }

    // ดึงคะแนนจาก Google Sheets
    async function fetchUserData() {
        const profile = await liff.getProfile();
        const response = await fetch(`${WEB_APP_URL}?action=getPoints&lineId=${profile.userId}`);
        const data = await response.json();
        if(data.points !== undefined) {
            document.getElementById('user-points').innerText = data.points;
            document.getElementById('point-detail').innerText = data.points;
        }
    }

    // ฟังก์ชันเปิดกล้องสแกน (ใช้ LIFF Scan QR)
    function scanQR(targetId) {
        if (!liff.isInClient()) {
            alert("ฟังก์ชันสแกนต้องเปิดผ่านแอป LINE เท่านั้นครับ");
            return;
        }
        liff.scanCodeV2().then(result => {
            document.getElementById('code' + targetId).value = result.value;
        }).catch(err => {
            console.log("Scan failed", err);
        });
    }

    async function submitPoints() {
        const codes = [
            document.getElementById('code1').value,
            document.getElementById('code2').value,
            document.getElementById('code3').value,
            document.getElementById('code4').value,
            document.getElementById('code5').value
        ].filter(c => c !== "");

        if (codes.length === 0) {
            alert("กรุณากรอกรหัสหรือสแกนก่อนครับ");
            return;
        }

        alert("กำลังส่งรหัส: " + codes.join(", "));
        // ส่วนส่งข้อมูลไปสะสมแต้ม พี่สามารถทำต่อใน Google Apps Script ได้เลยครับ
    }

    window.onload = initPage;
</script>
</body>
</html>
