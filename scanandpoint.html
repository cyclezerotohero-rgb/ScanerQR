<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan & Point - CYCLE POINT</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { margin: 0; font-family: 'Kanit', sans-serif; background-color: #285B48; text-align: center; }
        .header-white { background-color: white; padding: 25px; border-radius: 0 0 35px 35px; margin-bottom: 20px; }
        .point-box { background-color: #001f3f; color: white; display: inline-flex; align-items: center; padding: 10px 25px; border-radius: 50px; font-size: 1.2rem; }
        .point-val { color: #FFD700; font-weight: bold; font-size: 1.5rem; margin: 0 10px; }
        .scan-card { background-color: #FFD700; padding: 20px; border-radius: 25px; width: 90%; max-width: 500px; margin: 0 auto; box-sizing: border-box; }
        .input-group { position: relative; margin-bottom: 12px; }
        input { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid #285B48; box-sizing: border-box; font-size: 1rem; }
        .cam-btn { position: absolute; right: 8px; top: 6px; background: #285B48; color: white; padding: 6px 10px; border-radius: 8px; cursor: pointer; z-index: 10; }
        #reader { width: 100%; border-radius: 15px; overflow: hidden; display: none; margin-bottom: 15px; border: 3px solid #285B48; background: black; }
        
        /* สไตล์แจ้งเตือนเปิดบราวเซอร์มุมขวาล่าง */
        .browser-tip {
            display: none;
            background: white;
            color: #285B48;
            padding: 15px;
            border-radius: 15px;
            margin: 10px auto;
            width: 95%;
            font-size: 0.9rem;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 2px solid #285B48;
        }
        
        .arrow-pointer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 50px;
            color: #FFD700;
            z-index: 9999;
            display: none;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            animation: bounce-down 1s infinite;
        }

        @keyframes bounce-down {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(15px) scale(1.1); }
        }

        .button-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-confirm { flex: 1; padding: 15px; border-radius: 50px; background-color: #285B48; color: white; border: none; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        .btn-redeem { flex: 1; padding: 15px; border-radius: 50px; background-color: white; color: #285B48; border: 2px solid #285B48; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="arrow-pointer" class="arrow-pointer">↘️</div>

    <div class="header-white">
        <div class="point-box">Cycle point ของคุณ<span id="pts" class="point-val">0</span> P</div>
    </div>

    <div class="scan-card">
        <div id="reader"></div>
        
        <div id="browser-tip" class="browser-tip">
            💡 <b>ถ้ากล้องไม่ขึ้น:</b> ให้กดที่เมนู <b>มุมขวาล่าง</b> <br> 
            แล้วเลือก <b>"เปิดด้วยเบราว์เซอร์เริ่มต้น"</b>
        </div>

        <p style="color:#285B48; font-weight:bold; margin-top:10px;">กดไอคอนกล้องเพื่ออ่าน Barcode </p>
        
        <div class="input-group"><input type="text" id="c1" placeholder="รหัสที่ 1"><span class="cam-btn" onclick="startScan(1)">📷</span></div>
        <div class="input-group"><input type="text" id="c2" placeholder="รหัสที่ 2"><span class="cam-btn" onclick="startScan(2)">📷</span></div>
        <div class="input-group"><input type="text" id="c3" placeholder="รหัสที่ 3"><span class="cam-btn" onclick="startScan(3)">📷</span></div>
        <div class="input-group"><input type="text" id="c4" placeholder="รหัสที่ 4"><span class="cam-btn" onclick="startScan(4)">📷</span></div>
        <div class="input-group"><input type="text" id="c5" placeholder="รหัสที่ 5"><span class="cam-btn" onclick="startScan(5)">📷</span></div>
        
        <div class="button-group">
            <button class="btn-confirm" id="submit-btn" onclick="submit()">ยืนยันรับแต้ม</button>
            <button class="btn-redeem" onclick="goToRedeem()">🎁 แลกพอยต์</button>
        </div>
    </div>

<script>
    const LIFF_ID = "2009955496-jzd8tA0e";
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzvkBcXU19I0IHk5NCJYfmwXJuv8z3r8LpriifAMKXOKY9njy-RqE1D8h3_k2PFmr4-/exec";
    let html5QrCode;

    async function init() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) { liff.login(); return; }
            const profile = await liff.getProfile();
            fetchData(profile.userId);
        } catch (err) { console.error("Init error:", err); }
    }

    async function fetchData(uid) {
        try {
            const res = await fetch(`${WEB_APP_URL}?action=checkUser&lineId=${uid}`);
            const data = await res.json();
            document.getElementById('pts').innerText = data.points || 0;
        } catch (e) { console.error("Fetch error:", e); }
    }

    function startScan(id) {
        if (liff.isInClient() && liff.isApiAvailable('scanCodeV2')) {
            liff.scanCodeV2().then(result => {
                if (result.value) {
                    document.getElementById('c' + id).value = result.value;
                }
            }).catch(err => {
                console.error(err);
            });
        } else {
            const readerDiv = document.getElementById('reader');
            const tipDiv = document.getElementById('browser-tip');
            const arrow = document.getElementById('arrow-pointer');
            
            readerDiv.style.display = 'block';
            tipDiv.style.display = 'block';
            arrow.style.display = 'block';

            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");

            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                txt => {
                    document.getElementById('c' + id).value = txt;
                    html5QrCode.stop().then(() => {
                        readerDiv.style.display = 'none';
                        tipDiv.style.display = 'none';
                        arrow.style.display = 'none';
                    });
                }
            ).catch(err => {
                console.error(err);
                alert("ไม่สามารถเปิดกล้องได้ กรุณากดเมนูมุมขวาล่างแล้วเลือก 'เปิดด้วยบราวเซอร์เริ่มต้น'");
            });
        }
    }

    async function submit() {
        const btn = document.getElementById('submit-btn');
        btn.innerText = "กำลังบันทึก...";
        btn.disabled = true;

        try {
            const profile = await liff.getProfile();
            const codes = [
                document.getElementById('c1').value,
                document.getElementById('c2').value,
                document.getElementById('c3').value,
                document.getElementById('c4').value,
                document.getElementById('c5').value
            ].filter(v => v.trim() !== "");

            if (codes.length === 0) {
                alert("กรุณาสแกนรหัสอย่างน้อย 1 รายการ");
                btn.innerText = "ยืนยันรับแต้ม";
                btn.disabled = false;
                return;
            }

            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({
                    action: "addPoints",
                    lineId: profile.userId,
                    codes: codes
                })
            });

            alert("สะสมแต้มสำเร็จ!");
            setTimeout(() => { location.reload(); }, 2000);

        } catch (err) {
            console.error(err);
            alert("เกิดข้อผิดพลาด กรุณาลองใหม่");
            btn.innerText = "ยืนยันรับแต้ม";
            btn.disabled = false;
        }
    }

    function goToRedeem() {
        window.location.href = "reward.html";
    }

    window.onload = init;
</script>
</body>
</html>
